name: kytew
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kytew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kytew_local_only}
      POSTGRES_DB: kytew
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kytew -d kytew"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  livekit:
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    profiles: ["voice"]
    command: ["--config", "/etc/livekit.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["./.local/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
volumes:
  postgres_data:
  redis_data:
