name: KYTEW checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kytew
          POSTGRES_PASSWORD: kytew_local_only
          POSTGRES_DB: kytew
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kytew -d kytew" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run voice:setup
        env:
          LIVEKIT_NODE_IP: 127.0.0.1
      - run: docker compose --profile voice up -d --wait livekit
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
